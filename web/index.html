<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rastros Snake - Jogo Neon 2D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rastros Snake">
  <title>Rastros Snake</title>
  
  <!-- Fonte Arredondada Futurista -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050b18;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      z-index: 20 !important;
    }

    /* Linhas em estilo Rabisco Neon no Fundo */
    .neon-scribbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
    }

    .neon-scribbles svg {
      width: 100%;
      height: 100%;
    }

    .loading-container {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Titulo Arredondado com Animacao de Brilho e Pulso */
    .title-neon {
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 35px;
      display: inline-block;
      text-shadow: 
        0 0 8px #fff,
        0 0 15px #00f0ff,
        0 0 25px #00f0ff,
        0 0 45px #ff007f;
      animation: bounceGlow 2s infinite ease-in-out;
    }

    /* Trilho da Barra de Progresso */
    .progress-track {
      width: 320px;
      height: 24px;
      background: rgba(5, 15, 35, 0.8);
      border: 2px solid #00f0ff;
      border-radius: 30px;
      padding: 3px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* Container da Cobrinha que Anda */
    .snake-loader {
      position: absolute;
      top: 3px;
      left: 3px;
      height: 18px;
      width: 0%;
      max-width: calc(100% - 6px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-radius: 20px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), #ff007f);
      animation: moveSnake 3s infinite ease-in-out;
    }

    /* Corpo e Cabeca da Cobrinha Neon */
    .snake-body {
      display: flex;
      align-items: center;
    }

    .snake-segment {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #00f0ff;
      margin-right: -3px;
      box-shadow: 0 0 8px #00f0ff;
    }

    .snake-head {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #ff007f;
      box-shadow: 0 0 12px #ff007f, 0 0 20px #ff007f;
      position: relative;
      z-index: 2;
    }

    .loading-text {
      color: #00f0ff;
      font-size: 16px;
      font-weight: 600;
      margin-top: 18px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px #00f0ff;
    }

    /* Animacoes */
    @keyframes bounceGlow {
      0%, 100% {
        transform: translateY(0) scale(1);
        text-shadow: 0 0 8px #fff, 0 0 15px #00f0ff, 0 0 25px #00f0ff, 0 0 45px #ff007f;
      }
      50% {
        transform: translateY(-6px) scale(1.03);
        text-shadow: 0 0 12px #fff, 0 0 22px #ff007f, 0 0 35px #ff007f, 0 0 60px #00f0ff;
      }
    }

    @keyframes moveSnake {
      0% {
        width: 10%;
      }
      50% {
        width: 70%;
      }
      100% {
        width: 98%;
      }
    }
  </style>
</head>
<body>

  <!-- Rabiscos Neon em Vetor no Fundo -->
  <div class="neon-scribbles">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="none">
      <path d="M-50,100 Q150,200 300,50 T700,200" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.6"/>
      <path d="M100,650 Q400,300 750,550" fill="none" stroke="#ff007f" stroke-width="2.5" opacity="0.5"/>
      <path d="M500,-50 Q300,250 850,300" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
      <path d="M50,400 C200,200 400,500 600,350" fill="none" stroke="#eab308" stroke-width="2" opacity="0.4"/>
    </svg>
  </div>

  <!-- Container Principal -->
  <div class="loading-container" id="loading-screen">
    <div class="title-neon">Rastros Snake</div>
    
    <div class="progress-track">
      <div class="snake-loader">
        <div class="snake-body">
          <div class="snake-segment"></div>
          <div class="snake-segment"></div>
          <div class="snake-segment"></div>
        </div>
        <div class="snake-head"></div>
      </div>
    </div>

    <div class="loading-text">Carregando jogo...</div>
  </div>

  <!-- Script de Transicao para o Flutter -->
  <script>
    console.log('[INIT] HTML carregado — aguardando Flutter...');

    window.addEventListener('flutter-first-frame', function () {
      console.log('[INIT] Flutter first frame renderizado');
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.remove();
      }
    });

    window.addEventListener('error', function (event) {
      console.error('[INIT][ERRO] Script:', event.message);
    });

    setTimeout(function () {
      var loadingScreen = document.getElementById('loading-screen');
      if (!loadingScreen) return;
      console.warn('[INIT] Timeout 15s — removendo splash e liberando UI');
      var loadingText = loadingScreen.querySelector('.loading-text');
      if (loadingText) {
        loadingText.textContent = 'Carregamento lento — liberando tela...';
      }
      loadingScreen.style.opacity = '0';
      loadingScreen.style.pointerEvents = 'none';
      setTimeout(function () { loadingScreen.remove(); }, 500);
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
