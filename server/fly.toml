# fly.toml app configuration file generated for rastros-snake on 2026-08-13T19:33:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rastros-snake'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
