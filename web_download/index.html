<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rastros Snake — Baixar</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      max-width: 400px;
      text-align: center;
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 20px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #94a3b8; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 18px 40px;
      background: #22c55e;
      color: #052e16;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
    }
    .btn:active { background: #16a34a; }
    .info { margin-top: 16px; font-size: 14px; color: #64748b; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🐍 Rastros Snake</h1>
    <p>Jogo da cobrinha para Android.<br>Modo solo e equipe.</p>

    <!-- Botão de download: aponta para o APK na mesma pasta -->
    <a class="btn" href="RastrosSnake.apk" download="RastrosSnake.apk">
      Baixar Jogo
    </a>

    <p class="info">v1.0.0 · ~87 MB · Android</p>
    <p class="info">Após baixar, abra o arquivo e instale.</p>
  </div>
</body>
</html>
